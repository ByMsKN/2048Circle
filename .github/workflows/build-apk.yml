name: Android Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk SimyaCemberi.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.2.0
          name: "Simya Çemberi v1.2.0 (Canlı Renkler & Kesintisiz Dairesel Akış)"
          body: "🎨 **Yenilikler:**\n- 10 daire arasında geniş boşluklar (kesinlikle temas etmez)\n- Çevirme yönüne göre yuvalar arasında gerçek akış (rastgele yeniden dizilme kaldırıldı)\n- Büyütülmüş sevimli emojiler ve rengarenk şeker temalı arayüz\n- Güç Kazanı dolduğunda 2 alanı temizleyen yıldırım efekti"
          files: SimyaCemberi.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimyaCemberi-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
