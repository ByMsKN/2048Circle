name: Android Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk SimyaCemberi.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v2.1.0
          name: "Simya Çemberi v2.1.0 (Otomatik Güncelleme Desteği)"
          body: "🚀 **YENİLİKLER (v2.1.0):**\n- **GitHub Otomatik Güncelleme:** Oyun açıldığında yeni sürüm olup olmadığını GitHub üzerinden otomatik kontrol eder.\n- **Tek Tıkla APK Kurulumu:** Uygulama içinden indirme çubuğuyla doğrudan en son sürüme güncellenir.\n- **8 Yuvalı Dengeli Mekanik:** 45° hassas aralıklı daireler, öngörülebilir 1 adımlı kaydırma ve şarjlı Yıldırım Kazanı."
          files: SimyaCemberi.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimyaCemberi-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
