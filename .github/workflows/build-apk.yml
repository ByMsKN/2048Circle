name: Android Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk SimyaCemberi.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.1.0
          name: "2048 Çemberi v3.1.0 (Sade, Ferah & Akıcı Tek Çember)"
          body: "🎉 **2048 ÇEMBERİ (v3.1.0):**\n- **Tek Çember (8 Ferah Yuva):** 3 halka karmaşası kaldırıldı; göz yormayan, son derece net ve sade tek çember tasarımına geçildi.\n- **Kolay ve Akıcı Oynanış:** Sağa veya Sola kaydırarak (veya 2 büyük butonla) taşları çevirin ve aynı sayıları birleştirin.\n- **Büyük 2048 Sayı Taşları:** 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024, 2048.\n- **Şarjlı Güç Kazanı:** %100 dolduğunda 2 taşı temizleyerek alan açar.\n- **Akıllı Otomatik Güncelleme:** Uygulama güncelse hiçbir bildirim/buton çıkmaz."
          files: SimyaCemberi.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimyaCemberi-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
