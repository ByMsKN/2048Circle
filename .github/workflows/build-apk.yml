name: Android Build & Release APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Rename APK for Release
        run: cp app/build/outputs/apk/debug/app-debug.apk SimyaCemberi.apk

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v3.0.0
          name: "2048 Çemberi v3.0.0 (Gerçek Dairesel 2048 Deneyimi)"
          body: "🎉 **2048 ÇEMBERİ (v3.0.0):**\n- **3 Eşmerkezli Halka (İç, Orta, Dış):** Toplam 24 yuva ile tam dairesel 2048 geometrisi.\n- **4 Yönlü Hamle:** Sağa ve Sola döndürme (çember yörüngesi), İçe ve Dışa kaydırma (radyal eksen).\n- **Klasik 2048 Sayıları:** 2, 4, 8, 16, 32, 64, 128, 256, 512, 1024 ve 2048 sayı blokları.\n- **Güç Kazanı Jokeri:** Birleşmelerle şarj olan merkez kazan, %100 olduğunda 2 taş temizleyerek alan açar.\n- **GitHub Otomatik Güncelleme:** Uygulama içinden tek tıkla güncelleme."
          files: SimyaCemberi.apk
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: SimyaCemberi-Debug-APK
          path: app/build/outputs/apk/debug/app-debug.apk
